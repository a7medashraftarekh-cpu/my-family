<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a53">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>my family</title>
</head>
<body>

<section id="auth" class="screen">
  <div class="hero"><img src="icon-192.png" class="logo" alt=""><h1>my family</h1><p>عيلتنا كلها في مكان واحد</p></div>
  <div class="sheet">
    <div class="tabs"><button id="tLogin" class="on">دخول</button><button id="tReg">حساب جديد</button></div>
    <div id="pLogin">
      <input id="lCode" placeholder="كود الطالب" autocomplete="off" inputmode="latin">
      <div id="leaderBox" hidden>
        <input id="lMail" placeholder="إيميل الليدر" type="email">
        <input id="lPass" placeholder="كلمة السر" type="password">
      </div>
      <button class="btn" id="bLogin">دخول</button>
      <a class="link" id="toLeader">دخول الليدر</a>
    </div>
    <div id="pReg" hidden>
      <input id="rCode" placeholder="كود الطالب" autocomplete="off">
      <input id="rName" placeholder="الاسم رباعي (بيظهر للليدر بس)">
      <input id="rNick" placeholder="النك نيم (اللي هيظهر للناس)" maxlength="20">
      <button class="btn" id="bReg">إرسال طلب الانضمام</button>
    </div>
  </div>
</section>

<section id="wait" class="screen center" hidden>
  <img src="icon-192.png" class="logo" alt="">
  <h2>طلبك وصل للليدر</h2>
  <p>أول ما يوافق هتدخل تلقائي. سيب الصفحة مفتوحة.</p>
  <a class="link" id="waitOut">خروج</a>
</section>

<section id="app" class="screen" hidden>
  <header id="top"></header>
  <main id="main"></main>
  <footer id="composer" hidden>
    <div id="stickers" hidden></div>
    <div class="row">
      <button class="ic" id="bSt">☺</button>
      <input id="msg" placeholder="اكتب رسالة" autocomplete="off">
      <button class="send" id="bSend">➤</button>
    </div>
  </footer>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
